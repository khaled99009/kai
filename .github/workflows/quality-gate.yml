name: Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  # CI-only test-database settings. The service below runs on the ephemeral
  # GitHub-hosted runner, which is not reachable from the internet and is
  # destroyed after the job, and these values are never used by the application
  # outside this job. They are not production secrets; the local test stack uses
  # file-backed secrets.
  KAI_TEST_POSTGRES_ADMIN_USER: kai_test_admin
  # The safety gate in tests/conftest.py accepts only the `kai_test` database
  # name and the `kai_test` runtime role; these values must not drift.
  KAI_TEST_POSTGRES_USER: kai_test
  KAI_TEST_POSTGRES_DB: kai_test
  # Docker routing is explicit. The orchestrator requires this project-owned
  # context, verifies the daemon id after selecting it, and never inherits
  # DOCKER_HOST/DOCKER_CONTEXT/DOCKER_CONFIG.
  KAI_TEST_DOCKER_CONTEXT: default

jobs:
  tests:
    name: Python 3.14 - Lint, Type, DB Migrations, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # The official postgres image makes POSTGRES_USER a superuser, so this
      # account is a BOOTSTRAP ADMIN only: it initializes a fresh cluster and
      # provisions the runtime role. It is never named in DATABASE_URL; the
      # suite connects as the restricted `kai_test` role created below.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kai_test_admin
          POSTGRES_PASSWORD: ci_only_admin_password
          POSTGRES_DB: kai_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kai_test_admin -d kai_test"
          --health-start-period 10s
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The runtime role is created by the provisioning step below, so this URL
      # is only used after that step succeeds. Every component must match the
      # safety gate's expectations: the kai_test database, the kai_test role,
      # and the loopback test port. Alembic requires this explicit value; it
      # never falls back to Settings.
      ENVIRONMENT: test
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize masked CI database credentials
        shell: bash
        run: |
          set -euo pipefail
          admin_password='ci_only_admin_password'
          runtime_password="$(openssl rand -hex 24)"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$runtime_password"
          {
            echo "KAI_TEST_POSTGRES_ADMIN_PASSWORD=$admin_password"
            echo "KAI_TEST_POSTGRES_PASSWORD=$runtime_password"
            echo "DATABASE_URL=postgresql+asyncpg://kai_test:$runtime_password@127.0.0.1:55432/kai_test"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Ruff lint (repository-wide)
        run: ruff check .

      - name: Mypy type check (src only)
        run: mypy

      # The service container id from the workflow is the only Docker anchor.
      # The system identifier is read from the data directory with
      # pg_controldata, not from DATABASE_URL, and is bound to that container id
      # in a short-lived identity file. The orchestrator re-inspects the same
      # container and compares this value before it creates any database.
      - name: Capture trusted PostgreSQL identity
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          : "${POSTGRES_CONTAINER_ID:?service container id is unavailable}"
          if ! identifier="$(
            docker --context "$KAI_TEST_DOCKER_CONTEXT" exec "$POSTGRES_CONTAINER_ID" \
              pg_controldata 2>/dev/null \
              | sed -n 's/^Database system identifier:[[:space:]]*//p'
          )"; then
            identifier="$(
              docker --context "$KAI_TEST_DOCKER_CONTEXT" exec "$POSTGRES_CONTAINER_ID" \
                pg_controldata -D /var/lib/postgresql/data \
                | sed -n 's/^Database system identifier:[[:space:]]*//p'
            )"
          fi
          test -n "$identifier"
          IDENTITY_FILE="$RUNNER_TEMP/kai_pg_identity.json"
          POSTGRES_CONTAINER_ID="$POSTGRES_CONTAINER_ID" \
          KAI_SYSTEM_IDENTIFIER="$identifier" \
          IDENTITY_FILE="$IDENTITY_FILE" \
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime

          with open(os.environ["IDENTITY_FILE"], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "container_id": os.environ["POSTGRES_CONTAINER_ID"],
                      "system_identifier": os.environ["KAI_SYSTEM_IDENTIFIER"],
                      "created_at": datetime.now(UTC).isoformat(),
                  },
                  handle,
              )
          PY
          echo "KAI_TEST_PG_CONTAINER_ID=$POSTGRES_CONTAINER_ID" >> "$GITHUB_ENV"
          echo "KAI_TEST_PG_IDENTITY_FILE=$IDENTITY_FILE" >> "$GITHUB_ENV"
          echo "KAI_TEST_PG_ANCHOR_KIND=ci" >> "$GITHUB_ENV"

      # The compose stack under docker/ is intentionally not used here: it is
      # not part of the tracked tree yet, so a CI checkout would not contain it.
      # This step reproduces the init script's role semantics inline instead:
      # a LOGIN role that is NOSUPERUSER/NOCREATEDB/NOCREATEROLE, owns only its
      # own test database and the public schema, and is the only account named
      # in the test DATABASE_URL.
      - name: Provision the restricted test database role
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/pgadmin.env"' EXIT
          : "${POSTGRES_CONTAINER_ID:?service container id is unavailable}"
          # The password reaches psql through an ephemeral env file, never
          # argv. This is a CI-only throwaway credential; the same value is
          # used by DATABASE_URL.
          printf 'PGPASSWORD=%s\n' "$KAI_TEST_POSTGRES_ADMIN_PASSWORD" \
            > "$RUNNER_TEMP/pgadmin.env"
          chmod 600 "$RUNNER_TEMP/pgadmin.env"
          docker --context "$KAI_TEST_DOCKER_CONTEXT" exec -i \
            --env-file "$RUNNER_TEMP/pgadmin.env" \
            "$POSTGRES_CONTAINER_ID" \
            psql \
              --host 127.0.0.1 \
              --username "$KAI_TEST_POSTGRES_ADMIN_USER" \
              --dbname "$KAI_TEST_POSTGRES_DB" \
              --set ON_ERROR_STOP=1 <<SQL
          CREATE ROLE kai_test
            WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
            PASSWORD '$KAI_TEST_POSTGRES_PASSWORD';
          ALTER DATABASE kai_test OWNER TO kai_test;
          ALTER SCHEMA public OWNER TO kai_test;
          GRANT ALL ON SCHEMA public TO kai_test;
          SQL

      - name: Verify the restricted test database role
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/pgruntime.env"' EXIT
          : "${POSTGRES_CONTAINER_ID:?service container id is unavailable}"
          printf 'PGPASSWORD=%s\n' "$KAI_TEST_POSTGRES_PASSWORD" \
            > "$RUNNER_TEMP/pgruntime.env"
          chmod 600 "$RUNNER_TEMP/pgruntime.env"
          actual="$(
            docker --context "$KAI_TEST_DOCKER_CONTEXT" exec -i \
              --env-file "$RUNNER_TEMP/pgruntime.env" \
              "$POSTGRES_CONTAINER_ID" \
              psql \
                --host 127.0.0.1 \
                --username "$KAI_TEST_POSTGRES_USER" \
                --dbname "$KAI_TEST_POSTGRES_DB" \
                --no-align --tuples-only --set ON_ERROR_STOP=1 <<'SQL'
          SELECT current_user, current_database(),
                 (SELECT rolsuper FROM pg_roles WHERE rolname = current_user),
                 (SELECT rolcreatedb FROM pg_roles WHERE rolname = current_user),
                 (SELECT rolcreaterole FROM pg_roles WHERE rolname = current_user),
                 (SELECT rolreplication FROM pg_roles WHERE rolname = current_user),
                 pg_get_userbyid((SELECT datdba FROM pg_database WHERE datname = current_database())),
                 pg_get_userbyid((SELECT nspowner FROM pg_namespace WHERE nspname = 'public'));
          SQL
          )"
          expected="kai_test|kai_test|f|f|f|f|kai_test|kai_test"
          echo "test database identity and privileges: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "expected: $expected" >&2
            exit 1
          fi

      - name: Apply database migrations
        run: alembic upgrade head

      # The orchestrator provisions one unique database, runs only db_migration
      # tests against it, verifies the normal kai_test baseline was untouched,
      # and removes only that database. It never runs the normal suite.
      - name: Run isolated migration tests
        run: python scripts/run_migration_tests.py

      - name: Run normal tests
        env:
          # Set only here, after provisioning and verification proved the target
          # is the dedicated kai_test database reached as the restricted
          # kai_test role. The gate still re-checks every condition itself.
          KAI_TEST_ALLOW_DB_TRUNCATE: "1"
        run: pytest -q -m "not db_migration"
